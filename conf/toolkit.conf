# toolkit.conf - shared configuration for ops-toolkit
# Sourced by every script. POSIX variable assignments only (no arrays).
# shellcheck shell=sh
# shellcheck disable=SC2034  # values are consumed by the scripts that source this file

# --- Logging (all logs live under one directory) ---
LOG_DIR="/var/log/ops-toolkit"
BACKUP_LOG="${LOG_DIR}/backup.log"
BAN_LOG="${LOG_DIR}/bans.log"

# --- Backup ---
# Space-separated list because POSIX sh has no arrays.
SOURCES="/etc /home/sudoshad /var/log"
BACKUP_ROOT="/backups"
RETENTION_DAYS="7"
LOCK_FILE="/var/run/ops-toolkit-backup.lock"

# --- SSH brute-force guard ---
AUTH_LOG="/var/log/auth.log"
THRESHOLD="5"
WHITELIST="127.0.0.1 ::1"   # never ban these; add your own admin IP here

# --- Health check ---
DISK_THRESHOLD="85"
MEM_THRESHOLD="85"
SERVICES="sshd ufw"
WEBHOOK_URL="${WEBHOOK_URL:-}"   # export before running to enable alerts
